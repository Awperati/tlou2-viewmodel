; TLOU2Viewmodel startup settings: one command per line, run once when the DLL loads.
; The same commands work while playing: write them into TLOU2Viewmodel.cmd.txt next to the DLL.

; Viewmodel: arms and the held gun drawn as if seen with a 60 degree field of view,
; at 0.75 of their real distance (keeps the gun out of walls).
arms 60 0.75
; Where the arms and gun sit in front of you: right, up, forward (metres; negative right = right side).
hold -0.09 0.04 0.3
; Head-turn limit while vaulting, climbing, on ledges and ladders: degrees either side of Ellie's body.
headlock 65
; Soft edge (degrees), ease-in and ease-out speeds (degrees per second).
headlock soft 12 180 300
